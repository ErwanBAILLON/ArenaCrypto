# Tickers the ETF lab (/etf) charts and the nightly `arena watch-ingest` keeps fresh.
# Yahoo Finance daily bars, public, no key. Not a universe: nothing here is traded by
# an agent; it is what a person looks at, overlays and prices with real fees.
#
# `currency` drives the FX-fee toggle in the lab (a EUR account buying a USD line pays
# a conversion spread both ways). `ttf` marks lines subject to the French financial
# transaction tax when bought (0.3 %, French large caps; ETFs are exempt, kept here so
# single stocks can be added later with the flag set).
tickers:
  # US, in USD
  - { symbol: SPY,        label: "S&P 500 (SPY)",                currency: USD }
  - { symbol: QQQ,        label: "Nasdaq 100 (QQQ)",             currency: USD }
  - { symbol: IWM,        label: "Russell 2000 (IWM)",           currency: USD }
  - { symbol: EEM,        label: "Émergents (EEM)",              currency: USD }
  - { symbol: GLD,        label: "Or (GLD)",                     currency: USD }
  - { symbol: SLV,        label: "Argent (SLV)",                 currency: USD }
  - { symbol: USO,        label: "Pétrole WTI (USO)",            currency: USD }
  - { symbol: TLT,        label: "Treasuries 20 ans (TLT)",      currency: USD }
  - { symbol: IEF,        label: "Treasuries 7-10 ans (IEF)",    currency: USD }
  - { symbol: HYG,        label: "High yield US (HYG)",          currency: USD }
  - { symbol: XLE,        label: "Énergie US (XLE)",             currency: USD }
  - { symbol: XLF,        label: "Financières US (XLF)",         currency: USD }
  - { symbol: SMH,        label: "Semi-conducteurs (SMH)",       currency: USD }
  - { symbol: VNQ,        label: "Immobilier US (VNQ)",          currency: USD }
  # Europe, UCITS in EUR (what a French account actually buys)
  - { symbol: CW8.PA,     label: "MSCI World (Amundi CW8)",      currency: EUR }
  - { symbol: ESE.PA,     label: "S&P 500 (BNP ESE)",            currency: EUR }
  - { symbol: PANX.PA,    label: "Nasdaq 100 (Amundi PANX)",     currency: EUR }
  - { symbol: PAEEM.PA,   label: "Émergents (Amundi PAEEM)",     currency: EUR }
  - { symbol: CAC.PA,     label: "CAC 40 (Amundi CAC)",          currency: EUR }
  - { symbol: EXS1.DE,    label: "DAX (iShares Core DAX)",       currency: EUR }
  - { symbol: ETZ.PA,     label: "Euro Stoxx 50 (BNP ETZ)",      currency: EUR }
  - { symbol: PHAU.PA,    label: "Or physique (WisdomTree PHAU)",currency: EUR }
  - { symbol: MTH.PA,     label: "Obligations € 1-3 ans (Amundi MTH)", currency: EUR }
  # Currencies
  - { symbol: EURUSD=X,   label: "EUR/USD",                      currency: USD }
  - { symbol: GBPUSD=X,   label: "GBP/USD",                      currency: USD }
