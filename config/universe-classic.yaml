# Classic markets, daily bars from Yahoo Finance (public, no key). Tickers are
# ETFs a retail investor can actually hold; indices themselves are not tradable
# so their ETF proxies are used. Currencies have their own arena (universe-fx.yaml).
name: classic
exchange: yahoo
market: classic
bar: 1d
symbols:
  - SPY        # S&P 500
  - QQQ        # Nasdaq 100
  - IWM        # Russell 2000
  - EXS1.DE    # DAX (iShares Core DAX)
  - CAC.PA     # CAC 40 (Lyxor)
  - EEM        # Emerging markets
  - GLD        # Gold
  - SLV        # Silver
  - USO        # Oil (WTI)
  - TLT        # US 20y Treasuries
binance_suffix: ""
fees:
  perp_taker: 0.0005   # broker commission + spread, per side
  slippage: 0.0002
  spot_taker: 0.0010
nav0: 10000.0
history_start: "2021-09-20T00:00:00Z"
