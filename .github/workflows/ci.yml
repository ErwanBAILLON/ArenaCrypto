name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arena_test
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PG_TEST_URL: postgresql://arena:arena@localhost:5433/arena_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --extra dev --extra web

      - name: Lint
        run: |
          uv run ruff check arena tests
          uv run ruff format --check arena tests

      - name: Test
        run: uv run pytest -q
