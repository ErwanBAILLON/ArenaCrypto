<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Arène{% endblock %}</title>
<style>
:root { --bg:#fbfbf9; --fg:#1d1f21; --muted:#6b7280; --line:#e2e4e8; --card:#ffffff; --accent:#0072B2;
        --ok:#009E73; --warn:#E69F00; --bad:#D55E00; --pill:#eef0f3; --bad-bg:#fdece4; --ok-bg:#e6f6f0; --warn-bg:#fdf3df; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#15171a; --fg:#e6e7ea; --muted:#9aa1ab; --line:#2b2f36; --card:#1d2024; --pill:#262a30;
          --bad-bg:#3a1f14; --ok-bg:#14322a; --warn-bg:#3a2e12; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); }
header h1 { margin:0; font-size:18px; } header nav a { margin-right:14px; color:var(--muted); }
header nav a.active { color:var(--fg); font-weight:600; }
header .status { margin-left:auto; color:var(--muted); font-size:12px; }
main { max-width:1100px; margin:0 auto; padding:16px 16px 48px; }
h2 { font-size:17px; margin:28px 0 8px; } h2:first-child { margin-top:8px; }
h3 { font-size:15px; margin:14px 0 6px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
.grid { display:grid; gap:16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.wide { grid-template-columns: 2fr 1fr; } }
.tablewrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:500; font-size:12px; }
td.n, th.n { text-align:right; white-space:nowrap; }
.pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:var(--pill); color:var(--fg); white-space:nowrap; }
.pill.champion { background:var(--ok); color:#fff; } .pill.challenger { background:var(--warn); color:#fff; }
.pill.retired, .pill.candidate { background:var(--pill); } .pill.null, .pill.benchmark { color:var(--muted); }
.pill.admitted { background:var(--ok); color:#fff; } .pill.rejected { background:var(--bad); color:#fff; }
.pill.entrée { background:var(--ok); color:#fff; } .pill.sortie { background:var(--bad); color:#fff; } .pill.taille { background:var(--warn); color:#fff; }
.pos { color:var(--ok); } .neg { color:var(--bad); }
.banner { padding:12px 16px; border-radius:8px; margin-bottom:16px; border:1px solid var(--line); background:var(--card); }
.banner.bad { background:var(--bad-bg); border-color:var(--bad); }
.banner strong { font-size:16px; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.muted { color:var(--muted); } .small { font-size:13px; }
code, pre { font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
pre { background:var(--pill); padding:8px 10px; border-radius:4px; overflow:auto; margin:0; }
.chart { display:block; color:var(--fg); }
details summary { cursor:pointer; color:var(--muted); }
ul.plain { margin:6px 0; padding-left:18px; } ul.plain li { margin:4px 0; }
.kpis { display:grid; gap:10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin:10px 0; }
.kpi { background:var(--pill); border-radius:8px; padding:8px 12px; }
.kpi .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; } .kpi .l { font-size:12px; color:var(--muted); }
.legend { font-size:13px; color:var(--muted); margin:8px 0 0; }
.feed li { padding:4px 0; border-bottom:1px solid var(--line); list-style:none; } .feed { padding:0; margin:0; }
.time { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1><a href="/">⚔️ Arène</a></h1>
  <nav>
    <a href="/" class="{{ 'active' if active == 'home' }}">En direct</a>
    <a href="/modeles" class="{{ 'active' if active == 'modeles' }}">Les familles</a>
    <a href="/trials" class="{{ 'active' if active == 'trials' }}">Tests</a>
    <a href="/alerts" class="{{ 'active' if active == 'alerts' }}">Alertes</a>
  </nav>
  <span class="status">argent virtuel, aucun ordre passé · {{ now|iso }} UTC</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
