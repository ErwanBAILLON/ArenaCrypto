{{- if and .Values.web.enabled .Values.web.basicAuth.enabled }}
# Projects Vault {{ .Values.web.basicAuth.vaultPath }} (single key `users`, htpasswd)
# into the Secret referenced by the Traefik BasicAuth middleware.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.web.basicAuth.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.web.basicAuth.secretName }}
    creationPolicy: Owner
    # spelled out because the ESO webhook defaults them anyway, and a field the
    # server adds is a field ArgoCD reports as drift forever
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.web.basicAuth.vaultPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
