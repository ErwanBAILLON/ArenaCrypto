{{- $jobs := list
  (dict "name" "tick"       "args" (list "tick")       "schedule" .Values.schedules.tick       "resources" .Values.resources.tick  "deadline" 3300 "tz" false)
  (dict "name" "news"       "args" (list "news")       "schedule" .Values.schedules.news       "resources" .Values.resources.light "deadline" 1500 "tz" false)
  (dict "name" "digest"     "args" (list "digest")     "schedule" .Values.schedules.digest     "resources" .Values.resources.light "deadline" 1800 "tz" true)
  (dict "name" "challenger" "args" (list "challenger") "schedule" .Values.schedules.challenger "resources" .Values.resources.heavy "deadline" 21600 "tz" false)
  (dict "name" "retrain"    "args" (list "retrain")    "schedule" .Values.schedules.retrain    "resources" .Values.resources.heavy "deadline" 21600 "tz" false)
}}
{{- if .Values.classic.enabled }}
{{- $u := .Values.classic.universePath }}
{{- $jobs = concat $jobs (list
  (dict "name" "classic-tick"       "args" (list "tick")       "schedule" .Values.classic.schedules.tick       "resources" .Values.resources.tick  "deadline" 3300  "tz" false "universe" $u)
  (dict "name" "classic-challenger" "args" (list "challenger") "schedule" .Values.classic.schedules.challenger "resources" .Values.resources.heavy "deadline" 21600 "tz" false "universe" $u)
) }}
{{- end }}
{{- if .Values.wide.enabled }}
{{- $w := .Values.wide.universePath }}
{{- $jobs = concat $jobs (list
  (dict "name" "wide-tick"     "args" (list "tick")           "schedule" .Values.wide.schedules.tick     "resources" .Values.resources.tick  "deadline" 3300  "tz" false "universe" $w)
  (dict "name" "wide-universe" "args" (list "universe-build") "schedule" .Values.wide.schedules.universe "resources" .Values.resources.heavy "deadline" 7200  "tz" false "universe" $w)
) }}
{{- end }}
{{- range $j := $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-{{ $j.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "arena.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $j.name }}
spec:
  schedule: {{ $j.schedule | quote }}
  {{- if $j.tz }}
  timeZone: {{ $.Values.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        {{- include "arena.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $j.name }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $j.deadline }}
      template:
        {{- include "arena.podTemplate" (dict "root" $ "component" $j.name "args" $j.args "resources" $j.resources "universe" $j.universe) | nindent 8 }}
{{- end }}
