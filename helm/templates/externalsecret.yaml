# Projects Vault {{ .Values.secrets.vaultPath }} (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# DATABASE_URL) into the K8s Secret consumed by every CronJob via envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.targetName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.targetName }}
    creationPolicy: Owner
    # spelled out because the ESO webhook defaults them anyway, and a field the
    # server adds is a field ArgoCD reports as drift forever
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.secrets.vaultPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
