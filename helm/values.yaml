image:
  repository: git.ebaillon.fr/bots/arena
  tag: "0.5.0-f1bfce3"   # sha-pinned: the bare version tag is re-pushed on every commit, so
                         # "Synced" would report a build the node had already cached (README: tags are pinned)
  pullPolicy: IfNotPresent

# Namespace already exists (PSA restricted, default-deny, allow-dns,
# allow-internet-https, ResourceQuota). The chart never creates it.
namespace: crypto-research

secrets:
  vaultPath: secret/arena          # keys: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DATABASE_URL
  targetName: arena-secrets
  clusterSecretStore: vault-backend

env:
  DRY_RUN: "false"
  MAX_ALERTS_PER_DAY: "20"
  ARENA_WORKERS: "2"        # = heavy cpu limit; null distribution runs in forked workers

schedules:
  tick: "5 * * * *"
  news: "*/30 * * * *"
  digest: "0 8 * * *"              # interpreted in .Values.timeZone
  challenger: "0 3 * * 0"
  retrain: "0 4 1,15 * *"
timeZone: Europe/Paris

resources:
  light:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  tick:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  heavy:
    requests: { cpu: 400m, memory: 640Mi }   # keep tick+news+challenger+retrain under the 2Gi namespace quota
    limits: { cpu: "2", memory: 2Gi }

# Second arena: classic markets (ETFs, FX) on daily Yahoo Finance bars.
classic:
  enabled: true
  universePath: /app/config/universe-classic.yaml
  schedules:
    tick: "20 0 * * 2-6"        # after the US close is final (00:00 UTC bar), Tue-Sat
    challenger: "0 6 * * 0"
  bootstrap: { enabled: false, since: "2021-09-20" }

# Third arena: a point-in-time top-50 of USDT perpetuals with per-symbol impact costs.
# Membership is rebuilt weekly from Binance's public archive (delisted symbols included);
# the tick restricts every snapshot to that week's members. Nothing here trains a model:
# `arena train-xs` is run by hand, and what it inserts is a challenger the gate must admit.
wide:
  enabled: true
  universePath: /app/config/universe-wide.yaml
  schedules:
    tick: "35 * * * *"           # offset from the crypto tick so the two never share the CPU
    universe: "30 1 * * 1"       # Mondays, before the 02:00 weekly re-selection is needed

bootstrap:
  enabled: false
  since: "2024-01-01"

networkPolicy:
  postgresNamespace: database

# Read-only dashboard (arena web). Auth is not in the app: enable basicAuth and
# create the htpasswd Secret (key `users`) in the namespace, or rely on Traefik/CrowdSec.
web:
  enabled: true
  host: arena.ebaillon.fr
  traefikNamespace: network
  basicAuth:
    enabled: true
    # Traefik requires a Secret holding exactly one key (`users`, htpasswd lines),
    # so it gets its own ExternalSecret from a dedicated Vault path.
    secretName: arena-web-auth
    vaultPath: secret/arena-web-auth
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 384Mi }
