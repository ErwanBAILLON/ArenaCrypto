[project]
name = "arena"
version = "0.1.2"
description = "Signal-only crypto research arena: competing models scored forward on public data, reported to Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
arena = "arena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
